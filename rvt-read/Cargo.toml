[package]
name = "duct-heal"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Rebuild a connected duct network from rvt-rs element output."

[lib]

[[bin]]
name = "duct-heal"
path = "src/main.rs"

[dependencies]
serde_json = "1"
# Read Revit files directly. Pinned: rvt-rs is pre-1.0 and its element
# fields are what `build` matches on.
rvt = { git = "https://github.com/mrsirrisrm/rvt-rs", rev = "f0bbc4f31e008fd27aa1fabef663c467748debdd", optional = true }

[features]
rvt = ["dep:rvt"]
