[package]
name = "duct-heal"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Rebuild a connected duct network from rvt-rs element output."

[lib]

[[bin]]
name = "duct-heal"
path = "src/main.rs"

[dependencies]
serde_json = "1"
# Read Revit files directly. Pinned: rvt-rs is pre-1.0 and its element
# fields are what `build` matches on.
rvt = { git = "https://github.com/mrsirrisrm/rvt-rs", rev = "ac6f8bf22b16b2cd0749de92e71916292c0d2b82", optional = true }

[features]
rvt = ["dep:rvt"]
