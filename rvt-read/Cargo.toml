[package]
name = "duct-heal"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Rebuild a connected duct network from rvt-rs element output."

[lib]

[[bin]]
name = "duct-heal"
path = "src/main.rs"

[dependencies]
serde_json = "1"
# Read Revit files directly. Pinned: rvt-rs is pre-1.0 and its element
# fields are what `build` matches on.
rvt = { git = "https://github.com/mrsirrisrm/rvt-rs", rev = "1f9de40676a8110cacf24fe528462f1f74c4ee25", optional = true }

[features]
rvt = ["dep:rvt"]
