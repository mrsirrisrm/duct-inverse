<!doctype html>
<meta charset="utf-8">
<title>Revit duct path</title>
<style>
  body { font: 14px/1.4 system-ui, sans-serif; margin: 16px; }
  table { border-collapse: collapse; font-variant-numeric: tabular-nums; }
  td, th { padding: 2px 8px; text-align: right; border-bottom: 1px solid #ddd; }
  td:nth-child(2), th:nth-child(2) { text-align: left; }
  pre { white-space: pre-wrap; }
</style>
<p>Pick a Revit file, its IFC export, or both. They are read here, in this tab; nothing is uploaded.</p>
<label>Revit <input type="file" id="rvt" accept=".rvt"></label>
<label>IFC <input type="file" id="ifc" accept=".ifc"></label>
<label>Unit sound power, 63 Hz–8 kHz <input id="lw" size="32" placeholder="optional: 8 values, dB re 1 pW"></label>
<button id="go">Analyse</button>
<p id="status"></p>
<div id="out"></div>
<script type="module">
const params = new URLSearchParams(location.search);
let runs = 0;
const worker = new Worker('./worker.js', { type: 'module' });
const status = document.getElementById('status');
const out = document.getElementById('out');

async function run(rvt, ifc, lw) {
  const files = [rvt, ifc].filter(Boolean);
  status.textContent = `analysing ${(files.reduce((n, f) => n + f.byteLength, 0) / 1e6).toFixed(0)} MB…`;
  worker.postMessage({ rvt, ifc, lw }, files);
}

worker.onmessage = ({ data }) => {
  window.__result = data;
  if (data.error) { status.textContent = data.error; return; }
  const { report: r, ms, wasmMemoryMB } = data;
  status.textContent = `${(ms / 1000).toFixed(1)} s, ${wasmMemoryMB} MB WASM memory`;
  // ?beacon reports the timing to the serving host, for runs nobody watches.
  if (params.has('beacon')) fetch(`/beacon?run=${++runs}&ms=${ms}&t=${encodeURIComponent(JSON.stringify(r.timings_ms))}&mem=${wasmMemoryMB}&nc=${r.path?.nc}`).catch(() => {});
  const p = r.path;
  if (!p) { out.textContent = 'no supply path found'; return; }
  const row = b => `<tr><td>${b.index}</td><td>${b.type} ${b.note}</td><td>${b.flow_l_s.toFixed(0)}</td>`
    + `<td>${b.velocity_m_s?.toFixed(1) ?? ''}</td>${b.lw_db.map(v => `<td>${v.toFixed(1)}</td>`).join('')}</tr>`;
  out.innerHTML = `
    <p>Islands ${r.recorded.islands} → ${r.healed.islands}; terminals reaching a unit
      ${r.recorded.terminals_with_equipment} → ${r.healed.terminals_with_equipment} of ${r.healed.terminals}.
      ${r.ifc ? `IFC: ${r.ifc.matched} elements matched, ${r.ifc.duct_geometry} ducts given geometry, ${r.ifc.added} added, ${r.ifc.ports} port joins, ${r.ifc.joined_inside} ends-inside joins, ${r.ifc.spaces} spaces.` : ''}</p>
    <p>${p.unit.family} (${p.system}) → ${p.terminal.family}: ${p.elements} elements, ${p.blocks.length} blocks,
      <b>NC ${p.nc}</b> in ${p.room.space ?? 'a stand-in room'} (${p.room.volume_m3} m³, ${p.room.terminals} diffuser${p.room.terminals > 1 ? 's' : ''})</p>
    ${r.rooms.length > 1 ? `<p>Next: ${r.rooms.slice(1, 6).map(m => `${m.space ?? 'terminal ' + m.dominant.terminal} NC ${m.nc}`).join(', ')}</p>` : ''}
    <table><tr><th>#</th><th>block</th><th>L/s</th><th>m/s</th>${p.bands_hz.map(f => `<th>${f}</th>`).join('')}</tr>
      ${p.blocks.map(row).join('')}
      <tr><td></td><td>receiver SPL, all the room's diffusers</td><td></td><td></td>${p.receiver_spl_db.map(v => `<td>${v.toFixed(1)}</td>`).join('')}</tr>
    </table>
    <pre>${[...r.warnings.map(w => 'warning: ' + w), ...r.assumptions.map(a => 'assumed: ' + a)].join('\n')}</pre>`;
};

const picked = id => document.getElementById(id).files[0]?.arrayBuffer();
const lw = () => document.getElementById('lw').value.trim().split(/[\s,]+/).filter(Boolean).map(Number);
document.getElementById('go').onclick = async () => run(await picked('rvt'), await picked('ifc'), lw().length ? lw() : undefined);
// ?model=<url>[&ifc=<url>], or ?ifc=<url> alone, loads files without the pickers (for automated runs).
const model = params.get('model');
const load = async url => url && (await fetch(url)).arrayBuffer();
// &repeat=N runs it N times in the same worker (for timing warm runs).
if (model || params.has('ifc')) for (let i = 0; i < Number(params.get('repeat') ?? 1); i++) run(await load(model), await load(params.get('ifc')));
</script>
